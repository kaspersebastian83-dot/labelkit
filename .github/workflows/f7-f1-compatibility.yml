name: F7 with pinned F1
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: f7-f1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  combined:
    name: LabelKit F7 + F1 (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply F1 in disposable checkout only
        shell: bash
        run: |
          git fetch origin dc0ac2624b6895bb3131d904c483bd66dfb05788
          git diff --unified=1 9495e373aa897577171c921e6b65b676e1a7c663 dc0ac2624b6895bb3131d904c483bd66dfb05788 -- index.html tests/projektzuordnung-browser.cjs tests/projektzuordnung.cjs > "$RUNNER_TEMP/f1.patch"
          git apply --3way "$RUNNER_TEMP/f1.patch"
          mkdir -p test-results
          git diff HEAD --stat > test-results/composition.txt
      - name: Pinned browser runtime
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: All Node tests including F1 and F7
        shell: bash
        run: |
          for test in export-flow browser-hint feldboegen feldprotokolle kuerzel pak-reset pak-vorbelegung projektzuordnung project-data; do
            node "tests/$test.cjs" | tee "test-results/$test.log"
          done
      - name: All browser tests including F1 and F7
        shell: bash
        run: |
          for test in tests/*-browser.cjs; do
            node "$test" "${{ matrix.browser }}" | tee "test-results/$(basename "$test").log"
          done
          node tests/feldprotokolle-ohne-ordner.cjs "${{ matrix.browser }}" | tee test-results/ohne-ordner.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f7-labelkit-f1-${{ matrix.browser }}
          path: test-results/
          retention-days: 14
