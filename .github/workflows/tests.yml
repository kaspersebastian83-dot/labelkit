name: Automated tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node tests (no browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: AidKit (Raumkürzel und ID-Regeln, liegt auf GitHub Pages unter ../aidkit/)
        uses: actions/checkout@v6
        with:
          repository: kaspersebastian83-dot/aidkit
          path: aidkit
      - name: Projektzentrale daneben holen (spektron-ordner.js byte-gleich prüfen)
        env:
          ZWEIG: ${{ github.head_ref }}
        # gleichnamiger Zweig in der Projektzentrale, falls es ihn gibt (Änderung in mehreren Repos), sonst main
        run: git clone --quiet --depth 1 --branch "$ZWEIG" https://github.com/kaspersebastian83-dot/projektzentrale.git ../projektzentrale 2>/dev/null || git clone --quiet --depth 1 https://github.com/kaspersebastian83-dot/projektzentrale.git ../projektzentrale
      - run: node tests/sicher-speichern.cjs
      - run: node tests/spektron-ordner.cjs
        env:
          SPEKTRON_ORDNER_PFLICHT: '1'
      - run: node tests/export-flow.cjs
      - run: node tests/browser-hint.cjs
      - run: node tests/feldboegen.cjs
      - run: node tests/feldprotokolle.cjs
      - run: node tests/kuerzel.cjs
      - run: node tests/pak-reset.cjs
      - run: node tests/pak-vorbelegung.cjs
      - run: node tests/projektzuordnung.cjs
      - run: node tests/project-data.cjs
      - run: node tests/ordnername.cjs
      - run: node tests/wandblatt-bohrkerne.cjs
      - run: node tests/hilfe-links.cjs
        env:
          AIDKIT_DIR: aidkit

  browser-tests:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Playwright (pinned, not part of the repository)
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Field forms in the real browser
        run: node tests/feldboegen-browser.cjs ${{ matrix.browser }}
      - name: Field protocol entry and scan filing in the real browser
        run: node tests/feldprotokolle-browser.cjs ${{ matrix.browser }}
      - name: Project data from the Projektzentrale in the real browser
        run: node tests/projektdaten-browser.cjs ${{ matrix.browser }}
      - name: F1 project association and explicit legacy confirmation
        run: node tests/projektzuordnung-browser.cjs ${{ matrix.browser }}
      - name: F7 refresh failures, retry, explicit stale exports and project changes
        run: node tests/project-data-browser.cjs ${{ matrix.browser }}
      - name: Field protocol entry without folder access (Safari behaviour)
        run: node tests/feldprotokolle-ohne-ordner.cjs ${{ matrix.browser }}
      - name: Mosaik bar (project, steps, next step) in the real browser
        run: node tests/leiste-browser.cjs ${{ matrix.browser }}

      - name: PAK reset with cancellation, entry and export regression checks
        run: node tests/pak-reset-browser.cjs ${{ matrix.browser }}

      - name: PAK defaults with separate add, fill and confirmed update actions
        run: node tests/pak-vorbelegung-browser.cjs ${{ matrix.browser }}

      - name: Interim save, errors, JSON round-trip and completion boundary
        run: node tests/zwischenstand-browser.cjs ${{ matrix.browser }}

      - name: Shared save guard, completion races and stale save confirmations
        run: node tests/speicher-races-browser.cjs ${{ matrix.browser }}

      - name: Place without staff code and „Ihr Kürzel“ from the Projektzentrale
        run: node tests/ort-kuerzel-browser.cjs ${{ matrix.browser }}

      - name: Guided PAK entry and direct card editing with keyboard and JSON round-trip
        run: node tests/gefuehrte-eingabe-browser.cjs ${{ matrix.browser }}
      - name: Raum/Ort-Vorschläge aus dem Projekt
        run: node tests/raumorte-browser.cjs ${{ matrix.browser }}
      - name: Laborübergabe – Datum maskiert, Kopie ohne zusätzliche Zeilen
        run: node tests/laboruebergabe-browser.cjs ${{ matrix.browser }}
      - name: AidKit (Raumkürzel und ID-Regeln, liegt auf GitHub Pages unter ../aidkit/)
        uses: actions/checkout@v6
        with:
          repository: kaspersebastian83-dot/aidkit
          path: aidkit
      - name: PN 98 – Feldbogen → Protokolle → Laborproben
        run: node tests/pn98-bruecke-browser.cjs ${{ matrix.browser }}
      - name: Projektdatei behält frühere Textbaustein-Angaben
        run: node tests/projektdatei-altwerte-browser.cjs ${{ matrix.browser }}
      - name: Wandblatt Bohrkerne – drucken, übertragen, Proben anlegen
        run: node tests/wandblatt-bohrkerne-browser.cjs ${{ matrix.browser }}
        env:
          AIDKIT_DIR: aidkit
